[package]
name = "mirrox"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
crossbeam-channel = "0.5"
ffmpeg-next = "7.1.0"
ffmpeg-sys-next = "7.1.0"

sdl2 = { version = "0.35.2", default-features = false, features = [] }

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.35.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
sdl2 = { version = "0.35.2", features = ["use-pkgconfig"] }

[build-dependencies]
cc = "1.0"

[features]
default = []
