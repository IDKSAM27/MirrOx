[package]
name = "mirrox"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.10"
image = "0.24"
tokio = { version = "1", features = ["full"] }
warp = "0.3"
futures-util = "0.3"

sdl2 = { version = "0.35.2", default-features = false, features = [] }

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.35.2", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
sdl2 = { version = "0.35.2", features = ["use-pkgconfig"] }